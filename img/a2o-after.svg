<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica,Arial,sans-serif">
<rect width="960" height="540" fill="#DDE2E8"/>
<rect x="150" y="26" width="660" height="500" rx="8" fill="#fff" stroke="#B9C0C8" stroke-width="2"/>
<rect x="190" y="62" width="14" height="46" fill="#2F5BFF"/>
<text x="218" y="92" font-size="40" font-weight="800" fill="#15181B">Operating manual</text>
<text x="218" y="124" font-size="19" fill="#555B61">Chapter 3 · Safety and maintenance</text>
<path d="M190 146H770" stroke="#CBD0D6" stroke-width="2"/>
<text x="190" y="186" font-size="21" fill="#2A2F34">Before any maintenance, disconnect</text><text x="190" y="216" font-size="21" fill="#2A2F34">the device from the mains and</text><text x="190" y="246" font-size="21" fill="#2A2F34">secure it against being switched on.</text>
<text x="190" y="296" font-size="21" fill="#2A2F34">Guards may only be removed by</text><text x="190" y="326" font-size="21" fill="#2A2F34">trained personnel. Afterwards they</text><text x="190" y="356" font-size="21" fill="#2A2F34">must be fully reassembled.</text><text x="190" y="386" font-size="21" fill="#2A2F34"></text>
<rect x="500" y="166" width="270" height="170" rx="6" fill="#EEF0F3" stroke="#CBD0D6" stroke-width="2"/>
<g stroke="#9AA1A8" stroke-width="3"><path d="M530 296V220M530 296H742"/></g>
<rect x="548" y="248" width="38" height="48" fill="#2F5BFF" opacity=".85"/><rect x="600" y="228" width="38" height="68" fill="#2F5BFF" opacity=".6"/><rect x="652" y="262" width="38" height="34" fill="#2F5BFF" opacity=".4"/>
<text x="500" y="358" font-size="16" font-style="italic" fill="#555B61">Fig. 4: Structure of the guard cover</text>
<g font-size="20"><rect x="190" y="400" width="580" height="38" fill="#15181B"/>
<text x="206" y="426" fill="#fff" font-weight="700">Interval</text><text x="370" y="426" fill="#fff" font-weight="700">Task</text><text x="600" y="426" fill="#fff" font-weight="700">Responsible</text>
<g fill="#2A2F34"><text x="206" y="462">daily</text><text x="370" y="462">Visual check</text><text x="600" y="462">Operator</text>
<text x="206" y="488">monthly</text><text x="370" y="488">Lubrication</text><text x="600" y="488">Technician</text>
<text x="206" y="514">yearly</text><text x="370" y="514">Main inspection</text><text x="600" y="514">Service</text></g></g>
