<text x="218" y="92" font-size="40" font-weight="800" fill="#15181B">Betriebsanleitung</text>
<text x="218" y="124" font-size="19" fill="#555B61">Kapitel 3 · Sicherheit und Wartung</text>
<path d="M190 146H770" stroke="#CBD0D6" stroke-width="2"/>
<text x="190" y="186" font-size="21" fill="#2A2F34">Vor jeder Wartung ist das Gerät</text><text x="190" y="216" font-size="21" fill="#2A2F34">vom Stromnetz zu trennen und</text><text x="190" y="246" font-size="21" fill="#2A2F34">gegen Wiedereinschalten zu sichern.</text>
<text x="190" y="296" font-size="21" fill="#2A2F34">Die Schutzeinrichtungen dürfen nur</text><text x="190" y="326" font-size="21" fill="#2A2F34">von geschulten Personen entfernt</text><text x="190" y="356" font-size="21" fill="#2A2F34">werden. Danach sind sie wieder</text><text x="190" y="386" font-size="21" fill="#2A2F34">vollständig zu montieren.</text>
<rect x="500" y="166" width="270" height="170" rx="6" fill="#EEF0F3" stroke="#CBD0D6" stroke-width="2"/>
<g stroke="#9AA1A8" stroke-width="3"><path d="M530 296V220M530 296H742"/></g>
<rect x="548" y="248" width="38" height="48" fill="#C23B2C" opacity=".85"/><rect x="600" y="228" width="38" height="68" fill="#C23B2C" opacity=".6"/><rect x="652" y="262" width="38" height="34" fill="#C23B2C" opacity=".4"/>
<text x="500" y="358" font-size="16" font-style="italic" fill="#555B61">Abb. 4: Aufbau der Schutzhaube</text>
<g font-size="20"><rect x="190" y="400" width="580" height="38" fill="#15181B"/>
<text x="206" y="426" fill="#fff" font-weight="700">Intervall</text><text x="370" y="426" fill="#fff" font-weight="700">Aufgabe</text><text x="600" y="426" fill="#fff" font-weight="700">Zuständig</text>
<g fill="#2A2F34"><text x="206" y="462">täglich</text><text x="370" y="462">Sichtprüfung</text><text x="600" y="462">Bediener</text>
<text x="206" y="488">monatlich</text><text x="370" y="488">Schmierung</text><text x="600" y="488">Technik</text>
